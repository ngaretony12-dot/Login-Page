
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #2457a7);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 14px;
      width: 300px;
      max-width: calc(100% - 80px);
      box-shadow: 0 8px 25px #0004;
    }

    h2 {
      text-align: center;
      color: #2457a7;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      background: #2457a7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Employee Login</h2>
    <p>Enter your login details below.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">Log In</button>
      <p id="message" role="status"></p>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Login form works! Account verification is not connected yet.";

        document.getElementById("message").style.color = "#2457a7";
      }
    );
  </script>
</body>
</html>
