
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #2457a7);
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 35px #0004;
        }

        h2 {
            text-align: center;
            color: #1d3557;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #3478db;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #173f80;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Employee Login</h2>
        <p class="subtitle">Sign in to your account</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p id="message" role="status"></p>

        <div class="footer">
            Employee Attendance System
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username && password) {
                message.style.color = "#2457a7";
                message.textContent =
                    "Form submitted! Secure login is not connected yet.";
            }
        });
    </script>

</body>
</html>
